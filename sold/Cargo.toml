[package]
edition = '2021'
name = 'sold'
version = '0.80.0'

[dependencies]
hex = '0.4'
base64 = '0.22'
anyhow = '1.0'
once_cell = '1.21'
serde_json = { features = [ 'unbounded_depth' ], version = '1.0' }
clap = { features = [ 'derive' ], version = '4.5' }
ever_abi = { git = 'https://github.com/everx-labs/ever-abi.git', tag = '2.8.6' }
ever_block = { git = 'https://github.com/everx-labs/ever-block.git', tag = '1.11.22' }
ever_assembler = { features = [ 'gosh' ], git = 'https://github.com/everx-labs/ever-assembler.git', tag = '1.9.4' }

[build-dependencies]
cmake = '0.1'
bindgen = "0.72.1"

[dev-dependencies]
assert_cmd = '2.1'
predicates = '3.1'
