[package]
edition = '2024'
name = 'sold'
version = '0.81.0'

[dependencies]
anyhow = '1.0'
base64 = '0.22'
clap = { features = [ 'derive' ], version = '4.5' }
hex = '0.4'
once_cell = '1.21'
serde_json = { features = [ 'unbounded_depth' ], version = '1.0' }
ed25519-dalek = "2.2.0"

tycho-types = { version = "0.3.2", features = ["abi"] }
tsol-asm = { git = 'https://github.com/broxus/tsol-asm', tag = "v1.10.0" }

[build-dependencies]
cmake = '0.1'
bindgen = "0.72.1"

[dev-dependencies]
assert_cmd = '2.1'
predicates = '3.1'


[patch.crates-io]
tycho-types = { git = "https://github.com/broxus/tycho-types.git", rev = "8f92466db1c8c91e354c0eee5feb5235c37e26f4" }